      security: []
  /api/v1/ads:
    get:
      summary: 'Get ads'
      operationId: getAds
      description: ''
      parameters:
        -
          in: query
          name: keys
          description: 'Array of ad keys to filter by.'
          example:
            - homepage-banner
            - sidebar-banner
          required: false
          schema:
            type: array
            description: 'Array of ad keys to filter by.'
            example:
              - homepage-banner
              - sidebar-banner
            items:
              type: string
      responses:
        503:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: true
                  message: 'API is currently disabled. Please contact the administrator to enable API access.'
                  data: null
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'API is currently disabled. Please contact the administrator to enable API access.'
                  data:
                    type: string
                    example: null
